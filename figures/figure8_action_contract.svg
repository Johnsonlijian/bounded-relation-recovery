<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <rect width="980" height="460" fill="#f7f5f2"/>
  <text x="28" y="32" font-family="Times New Roman, Times, serif" font-size="16" fill="#1c1917">Knowledge-constrained recovery returns an action, not a coefficient</text>
  <text x="28" y="52" font-family="Times New Roman, Times, serif" font-size="11" fill="#57534e">Two published relations enter the same contract. The action differs because the predicate that fires differs.</text>

  <!-- objects -->
  <text x="36" y="84" font-family="Times New Roman, Times, serif" font-size="12" fill="#1c1917">Objects</text>
  <g transform="translate(36,100)">
    <rect width="150" height="150" rx="2" fill="#fff" stroke="#d6d3d1"/>
    <text x="10" y="18" font-family="Times New Roman, Times, serif" font-size="11" fill="#44403c">Unequal-limb lipped angle</text>
    <polyline points="28,118 28,40 78,40 78,58" fill="none" stroke="#1d4e89" stroke-width="3"/>
    <polyline points="48,118 48,70 108,70 108,88" fill="none" stroke="#1d4e89" stroke-width="3"/>
    <text x="10" y="140" font-family="Times New Roman, Times, serif" font-size="10" fill="#57534e">state x = a/b</text>
  </g>
  <g transform="translate(36,262)">
    <rect width="150" height="150" rx="2" fill="#fff" stroke="#d6d3d1"/>
    <text x="10" y="18" font-family="Times New Roman, Times, serif" font-size="11" fill="#44403c">Lipped channel</text>
    <polyline points="40,118 40,42 100,42 100,62" fill="none" stroke="#1d4e89" stroke-width="3"/>
    <polyline points="40,118 100,118 100,98" fill="none" stroke="#1d4e89" stroke-width="3"/>
    <text x="10" y="140" font-family="Times New Roman, Times, serif" font-size="10" fill="#57534e">state eta = h/b</text>
  </g>

  <!-- contract -->
  <text x="230" y="84" font-family="Times New Roman, Times, serif" font-size="12" fill="#1c1917">Executable contract</text>
  <g font-family="Times New Roman, Times, serif" font-size="12" fill="#1c1917">
    <rect x="220" y="100" width="250" height="70" rx="2" fill="#fff" stroke="#1d4e89"/>
    <text x="232" y="122">Mechanics, before any fit</text>
    <text x="232" y="144" font-size="11" fill="#44403c">q(x) &gt; 0 and the declared trend</text>
    <text x="232" y="160" font-size="11" fill="#44403c">or k(eta) &gt; 0, mode class named</text>
    <rect x="220" y="182" width="250" height="70" rx="2" fill="#fff" stroke="#1d4e89"/>
    <text x="232" y="206">2. Finite-precision evidence</text>
    <text x="232" y="228" font-size="11" fill="#44403c">rounding intervals, not exact cells</text>
    <rect x="220" y="264" width="250" height="70" rx="2" fill="#fff" stroke="#1d4e89"/>
    <text x="232" y="288">3. Provenance contract</text>
    <text x="232" y="310" font-size="11" fill="#44403c">source, selector, what was not rerun</text>
  </g>
  <path d="M195 175 H220" stroke="#78716c" fill="none"/>
  <path d="M195 337 H220" stroke="#78716c" fill="none"/>

  <!-- actions -->
  <text x="520" y="84" font-family="Times New Roman, Times, serif" font-size="12" fill="#1c1917">Permitted action</text>
  <g font-family="Times New Roman, Times, serif">
    <rect x="510" y="100" width="440" height="78" rx="2" fill="#fff7ed" stroke="#c2410c"/>
    <text x="524" y="122" font-size="13" fill="#9a3412">Reject, non-executable</text>
    <text x="524" y="144" font-size="11" fill="#44403c">Printed angle expression is negative and decreasing</text>
    <text x="524" y="162" font-size="11" fill="#44403c">on 1.1 to 1.5. No fit is computed.</text>

    <rect x="510" y="190" width="440" height="78" rx="2" fill="#f0fdf4" stroke="#15803d"/>
    <text x="524" y="212" font-size="13" fill="#166534">Allow a bounded query</text>
    <text x="524" y="234" font-size="11" fill="#44403c">One of 48 printed-magnitude assignments passes.</text>
    <text x="524" y="252" font-size="11" fill="#44403c">630 rebuilt cells stay inside the 5 percent screen.</text>

    <rect x="510" y="280" width="440" height="92" rx="2" fill="#f8fafc" stroke="#334155"/>
    <text x="524" y="302" font-size="13" fill="#0f172a">Retain a bounded claim</text>
    <text x="524" y="324" font-size="11" fill="#44403c">Channel equation is positive, but the independent</text>
    <text x="524" y="342" font-size="11" fill="#44403c">sample moves from 14.8 percent low to 33 percent high</text>
    <text x="524" y="360" font-size="11" fill="#44403c">when the local-mode definition changes.</text>
  </g>
  <path d="M470 135 H510" stroke="#c2410c" fill="none"/>
  <path d="M470 217 H510" stroke="#15803d" fill="none"/>
  <path d="M470 310 H510" stroke="#334155" fill="none"/>
  <text x="28" y="440" font-family="Times New Roman, Times, serif" font-size="10" fill="#78716c">Operational design use is a further human gate and is not granted by this figure. Numbers are from the project outputs cited in the caption.</text>
</svg>
